<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Colors — Primary navy</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 20px 22px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style>
</head>
<body>
  <p class="eyebrow">Primary navy — actions, titles, sidebar</p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#040920"></div><div class="name">primary</div><div class="hex">#040920</div></div>
    <div class="swatch"><div class="chip" style="background:#06284f"></div><div class="name">primary-container</div><div class="hex">#06284f</div></div>
    <div class="swatch"><div class="chip" style="background:#0d3260"></div><div class="name">container-hover</div><div class="hex">#0d3260</div></div>
    <div class="swatch"><div class="chip" style="background:#123d73"></div><div class="name">container-active</div><div class="hex">#123d73</div></div>
  </div>
</body>
</html>
