<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Brand — Iconography</title>
<link rel="stylesheet" href="_card.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px 8px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .item i { color: #0d1f3c; }
  .item .name { font-size: 10px; color: var(--fg-4); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <p class="eyebrow">Lucide · stroke · 20 px · currentColor</p>
  <div class="grid">
    <div class="item"><i data-lucide="layout-dashboard"></i><span class="name">dashboard</span></div>
    <div class="item"><i data-lucide="users"></i><span class="name">associados</span></div>
    <div class="item"><i data-lucide="kanban"></i><span class="name">atividades</span></div>
    <div class="item"><i data-lucide="scale"></i><span class="name">jurídico</span></div>
    <div class="item"><i data-lucide="file-spreadsheet"></i><span class="name">ofícios</span></div>
    <div class="item"><i data-lucide="dollar-sign"></i><span class="name">financeiro</span></div>
    <div class="item"><i data-lucide="receipt"></i><span class="name">mensalidades</span></div>
    <div class="item"><i data-lucide="settings"></i><span class="name">config</span></div>
    <div class="item"><i data-lucide="shield"></i><span class="name">usuários</span></div>
    <div class="item"><i data-lucide="map-pin"></i><span class="name">lotações</span></div>
    <div class="item"><i data-lucide="webhook"></i><span class="name">webhooks</span></div>
    <div class="item"><i data-lucide="search"></i><span class="name">buscar</span></div>
    <div class="item"><i data-lucide="plus"></i><span class="name">novo</span></div>
    <div class="item"><i data-lucide="download"></i><span class="name">exportar</span></div>
    <div class="item"><i data-lucide="pencil"></i><span class="name">editar</span></div>
    <div class="item"><i data-lucide="alert-triangle" style="color:#b91c1c;"></i><span class="name">alerta</span></div>
  </div>
  <script>lucide.createIcons({ attrs: { width: 20, height: 20, "stroke-width": 2 } });</script>
</body>
</html>
