<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Colors — Accent</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 20px 22px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style>
</head>
<body>
  <p class="eyebrow">Accent — used sparingly</p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#76aeea"></div><div class="name">secondary · sky blue</div><div class="hex">#76aeea</div></div>
    <div class="swatch"><div class="chip" style="background:#e7c16b"></div><div class="name">tertiary · amber</div><div class="hex">#e7c16b</div></div>
    <div class="swatch"><div class="chip" style="background:#a16207"></div><div class="name">amber · deep</div><div class="hex">#a16207</div></div>
    <div class="swatch"><div class="chip" style="background:#4f3308"></div><div class="name">on-tertiary</div><div class="hex">#4f3308</div></div>
  </div>
</body>
</html>
