<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Spacing — scale</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 20px 22px; }
  .row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: nowrap; overflow-x: auto; }
  .unit { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .bar { background: #040920; height: 22px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; color: var(--fg-2); }
  .val { font-size: 10px; color: var(--fg-4); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <p class="eyebrow">4 px rhythm · spacing tokens</p>
  <div class="row">
    <div class="unit"><div class="bar" style="width:4px;"></div><div class="name">xs</div><div class="val">4</div></div>
    <div class="unit"><div class="bar" style="width:8px;"></div><div class="name">sm</div><div class="val">8</div></div>
    <div class="unit"><div class="bar" style="width:12px;"></div><div class="name">md</div><div class="val">12</div></div>
    <div class="unit"><div class="bar" style="width:16px;"></div><div class="name">lg</div><div class="val">16</div></div>
    <div class="unit"><div class="bar" style="width:20px;"></div><div class="name">xl</div><div class="val">20</div></div>
    <div class="unit"><div class="bar" style="width:24px;"></div><div class="name">2xl</div><div class="val">24</div></div>
    <div class="unit"><div class="bar" style="width:28px;"></div><div class="name">3xl</div><div class="val">28</div></div>
    <div class="unit"><div class="bar" style="width:32px;"></div><div class="name">4xl</div><div class="val">32</div></div>
    <div class="unit"><div class="bar" style="width:40px;"></div><div class="name">5xl</div><div class="val">40</div></div>
  </div>
</body>
</html>
