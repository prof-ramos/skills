<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Colors — Semantic</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 20px 22px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .pair { display: flex; flex-direction: column; gap: 6px; }
  .pair .bar { height: 36px; border-radius: 8px; border: 1px solid var(--border-hairline); }
  .pair .label { font-size: 11px; font-weight: 600; color: var(--fg-2); }
  .pair .hex { font-size: 10px; color: var(--fg-4); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <p class="eyebrow">Semantic — feedback states</p>
  <div class="row">
    <div class="pair">
      <div class="bar" style="background:#15803d;"></div>
      <div class="bar" style="background:#dcfce7; border-color: #bbf7d0;"></div>
      <div class="label">success / container</div>
      <div class="hex">#15803d · #dcfce7</div>
    </div>
    <div class="pair">
      <div class="bar" style="background:#a16207;"></div>
      <div class="bar" style="background:#f4ddb1; border-color: #e8c98a;"></div>
      <div class="label">warning / container</div>
      <div class="hex">#a16207 · #f4ddb1</div>
    </div>
    <div class="pair">
      <div class="bar" style="background:#b91c1c;"></div>
      <div class="bar" style="background:#fee2e2; border-color: #fca5a5;"></div>
      <div class="label">error / container</div>
      <div class="hex">#b91c1c · #fee2e2</div>
    </div>
    <div class="pair">
      <div class="bar" style="background:#76aeea;"></div>
      <div class="bar" style="background:#eff6ff; border-color: #bfdbfe;"></div>
      <div class="label">information</div>
      <div class="hex">#76aeea · #eff6ff</div>
    </div>
  </div>
</body>
</html>
