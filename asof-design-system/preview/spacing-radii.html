<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Spacing — radii</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 22px 24px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 60px; height: 60px; background: var(--surface-container-high); border: 1px solid var(--border-soft); }
  .name { font-size: 11px; font-weight: 600; color: var(--fg-2); }
  .val { font-size: 10px; color: var(--fg-4); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <p class="eyebrow">Corner radii · moderately soft</p>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:2px;"></div><div class="name">xs</div><div class="val">2 · dots</div></div>
    <div class="item"><div class="box" style="border-radius:4px;"></div><div class="name">sm</div><div class="val">4 · tags</div></div>
    <div class="item"><div class="box" style="border-radius:8px;"></div><div class="name">md</div><div class="val">8 · buttons</div></div>
    <div class="item"><div class="box" style="border-radius:10px;"></div><div class="name">lg</div><div class="val">10 · alerts</div></div>
    <div class="item"><div class="box" style="border-radius:16px;"></div><div class="name">box</div><div class="val">16 · cards</div></div>
    <div class="item"><div class="box" style="border-radius:9999px;"></div><div class="name">full</div><div class="val">∞ · badges</div></div>
  </div>
</body>
</html>
