<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Components — Table row</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 0; background: #fff; }
  .wrap { padding: 20px 22px 6px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--font-sans); font-size: 13px; }
  thead { background: #040920; color: #fff; }
  thead th { text-align: left; padding: 10px 16px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  tbody td { padding: 11px 16px; border-bottom: 1px solid rgba(4,9,32,0.05); color: #0d1f3c; vertical-align: middle; }
  tbody tr:hover td { background: #f8fafc; }
  .pill { display: inline-flex; padding: 3px 9px; border-radius: 9999px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .pill.active { background: #dcfce7; color: #15803d; }
  .pill.retired { background: #f8fafc; color: #59677a; border: 1px solid #dde3ec; }
</style>
</head>
<body>
  <div class="wrap"><p class="eyebrow">Table · navy header · hairline rows · pill status</p></div>
  <table>
    <thead>
      <tr><th>Nome</th><th>Lotação</th><th>Padrão</th><th>Situação</th></tr>
    </thead>
    <tbody>
      <tr><td><strong>Ana C. Pereira</strong></td><td>Embaixada em Paris</td><td>Classe B · Padrão 3</td><td><span class="pill active">Ativo</span></td></tr>
      <tr><td><strong>Bruno R. Almeida</strong></td><td>SERE — Brasília</td><td>Classe A · Padrão 5</td><td><span class="pill active">Ativo</span></td></tr>
      <tr><td><strong>Cláudia M. Souza</strong></td><td>Consulado em Boston</td><td>Classe Especial</td><td><span class="pill retired">Aposentado</span></td></tr>
    </tbody>
  </table>
</body>
</html>
