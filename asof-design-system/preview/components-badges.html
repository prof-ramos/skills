<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Components — Badges & status dots</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 22px 24px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 14px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-sans); font-size: 11px; font-weight: 700;
    letter-spacing: 0.10em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 9999px; line-height: 1;
  }
  .badge.success { background: #dcfce7; color: #15803d; }
  .badge.warning { background: #f4ddb1; color: #4f3308; }
  .badge.error   { background: #fee2e2; color: #b91c1c; }
  .badge.info    { background: #76aeea; color: #040920; }
  .badge.neutral { background: #f8fafc; color: #59677a; border: 1px solid #dde3ec; }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .tag.legal { background: #e7c16b; color: #4f3308; }
  .tag.info  { background: #76aeea; color: #040920; }
  .label { font-size: 10px; color: var(--fg-4); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-right: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
  <p class="eyebrow">Badges · pill 4×10 · squared status dots 8×8</p>
  <div class="row">
    <span class="label">Pills</span>
    <span class="badge success">Em dia</span>
    <span class="badge warning">Pendente</span>
    <span class="badge error">Inadimplente</span>
    <span class="badge neutral">Aposentado</span>
  </div>
  <div class="row">
    <span class="label">Tags</span>
    <span class="tag legal">Jurídico</span>
    <span class="tag info">Info</span>
  </div>
  <div class="row">
    <span class="label">Dots</span>
    <span class="dot" style="background:#94a3b8;"></span>
    <span class="dot" style="background:#76aeea;"></span>
    <span class="dot" style="background:#e7c16b;"></span>
    <span class="dot" style="background:#86efac;"></span>
    <span style="font-size:11px; color: var(--fg-4); margin-left:8px;">a fazer · em andamento · aguardando · concluído</span>
  </div>
</body>
</html>
