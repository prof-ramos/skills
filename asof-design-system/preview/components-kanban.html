<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Components — Kanban card</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 22px 24px; background: #f8fafc; font-family: var(--font-sans); }
  .col { background: #eef1f6; border-radius: 16px; padding: 12px; max-width: 260px; }
  .head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; }
  .head .dot { width: 8px; height: 8px; border-radius: 2px; background: #76aeea; }
  .head .title { font-size: 11px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: #0d1f3c; }
  .head .count { margin-left: auto; font-size: 11px; font-weight: 600; color: #59677a; background: rgba(4,9,32,0.06); border-radius: 9999px; padding: 1px 8px; }
  .card { background: #fff; border: 1px solid rgba(4,9,32,0.05); border-radius: 8px; padding: 12px; box-shadow: 0 1px 0 rgba(4,9,32,0.04); }
  .card + .card { margin-top: 8px; }
  .card .ttl { font-size: 14px; font-weight: 600; color: #0d1f3c; line-height: 1.35; }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 10px; }
  .pri { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .pri.alta { color: #a16207; }
  .pri.normal { color: rgba(13,31,60,0.70); }
  .due { color: rgba(13,31,60,0.55); }
  .associate { display: inline-block; margin-top: 12px; font-size: 10px; font-weight: 600; color: rgba(13,31,60,0.70); background: #f8fafc; border: 1px solid rgba(4,9,32,0.05); border-radius: 9999px; padding: 3px 8px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>
</head>
<body>
  <p class="eyebrow" style="color: rgba(13,31,60,0.55); margin-bottom: 12px;">Kanban column + card · 8 px radius · status dot + priority label</p>
  <div class="wrap">
    <div class="col">
      <div class="head"><span class="dot" style="background:#76aeea;"></span><span class="title">Em andamento</span><span class="count">2</span></div>
      <div class="card">
        <div class="ttl">Revisar parecer 014/2026</div>
        <div class="meta"><span class="pri alta">Alta</span><span class="due">· vence 22 mai</span></div>
        <div><span class="associate">Maria L. Carvalho</span></div>
      </div>
      <div class="card">
        <div class="ttl">Atualizar lotações do mês</div>
        <div class="meta"><span class="pri normal">Normal</span></div>
        <div><span class="associate">Sem associado</span></div>
      </div>
    </div>
    <div class="col">
      <div class="head"><span class="dot" style="background:#e7c16b;"></span><span class="title">Aguardando terceiros</span><span class="count">1</span></div>
      <div class="card">
        <div class="ttl">Resposta da Embaixada em Lisboa</div>
        <div class="meta"><span class="pri" style="color:#b91c1c;">Urgente</span><span class="due">· vencida há 3 dias</span></div>
        <div><span class="associate">João P. Andrade</span></div>
      </div>
    </div>
  </div>
</body>
</html>
