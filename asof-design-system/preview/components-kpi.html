<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Components — KPI card</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 22px 24px; background: #f8fafc; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .kpi {
    background: #fff;
    border: 1px solid rgba(4,9,32,0.05);
    border-top: 3px solid #76aeea;
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 110px;
  }
  .kpi .label { font-size: 10px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(13,31,60,0.65); }
  .kpi .metric { font-size: 30px; font-weight: 700; color: #040920; font-variant-numeric: tabular-nums; margin-top: 14px; line-height: 1; }
  .kpi .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .kpi .split > div + div { border-left: 1px solid rgba(4,9,32,0.05); padding-left: 14px; }
  .kpi .split > div { padding-right: 14px; }
</style>
</head>
<body>
  <p class="eyebrow" style="color: rgba(13,31,60,0.55); margin-bottom: 12px;">KPI card · 16 px radius · 3 px sky-blue top stripe</p>
  <div class="row">
    <div class="kpi">
      <div class="label">Associados ativos</div>
      <div class="metric">1.284</div>
    </div>
    <div class="kpi">
      <div class="split">
        <div><div class="label">Em aberto</div><div class="metric">47</div></div>
        <div><div class="label">Atrasadas</div><div class="metric" style="color:#b91c1c;">6</div></div>
      </div>
    </div>
    <div class="kpi">
      <div class="label">Taxa de contribuições</div>
      <div class="metric">92%</div>
    </div>
  </div>
</body>
</html>
