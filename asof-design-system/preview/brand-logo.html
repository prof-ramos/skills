<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Brand — Logo</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 0; }
  .grid { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; min-height: 240px; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 22px; position: relative; }
  .cell + .cell { border-left: 1px solid var(--border-soft); }
  .light  { background: #ffffff; }
  .canvas { background: #f8fafc; }
  .dark   { background: #040920; border-left: 1px solid rgba(255,255,255,0.06) !important; }
  .cell img { max-width: 92%; max-height: 160px; width: auto; height: auto; display: block; }
  .dark .lockup { filter: brightness(0) invert(1); }
  .meta {
    position: absolute; bottom: 10px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600;
  }
  .light .meta, .canvas .meta { color: var(--fg-4); }
  .dark  .meta { color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell light">
      <img src="../assets/asof-logo-full.png" alt="ASOF — lockup completo com tagline" />
      <span class="meta"><span>Lockup completo</span><span>logo-completa</span></span>
    </div>
    <div class="cell canvas">
      <img class="lockup" src="../assets/asof-logo-lockup.svg" alt="ASOF — lockup horizontal" />
      <span class="meta"><span>Horizontal · on surface</span><span>logo-superior</span></span>
    </div>
    <div class="cell dark">
      <img class="lockup" src="../assets/asof-logo-lockup.svg" alt="ASOF — lockup invertido para fundo navy" />
      <span class="meta"><span>Inverted · on primary</span><span>brightness(0) invert(1)</span></span>
    </div>
  </div>
</body>
</html>
