<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Type — Body & Labels</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 22px 24px; }
  .row-spec { display: grid; grid-template-columns: 1fr 110px; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-hairline); }
  .row-spec:last-child { border-bottom: none; }
  .spec { font-size: 10px; color: var(--fg-4); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; text-align: right; }
</style>
</head>
<body>
  <p class="eyebrow">Google Sans · variable 400–700</p>
  <div class="row-spec">
    <div style="font-size:16px; line-height:1.55; color: var(--fg-2);">A interface é uma sala de operações para uma associação profissional.</div>
    <div class="spec">Body 16 / 400</div>
  </div>
  <div class="row-spec">
    <div style="font-size:14px; line-height:1.5; color: var(--fg-2);">Inicialize as mensalidades do mês corrente em massa.</div>
    <div class="spec">Body 14 / 400</div>
  </div>
  <div class="row-spec">
    <div style="font-size:13px; font-weight:600; line-height:1.2; color: var(--fg-1);">Nova atividade</div>
    <div class="spec">Label 13 / 600</div>
  </div>
  <div class="row-spec">
    <div style="font-size:12px; line-height:1.45; color: var(--fg-3);">Vence em 14 dias · associado vinculado</div>
    <div class="spec">Body 12 / 400</div>
  </div>
</body>
</html>
