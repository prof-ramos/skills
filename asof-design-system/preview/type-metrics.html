<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Type — Metrics</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .cell { padding: 12px 14px; border: 1px solid var(--border-hairline); border-radius: 12px; border-top: 3px solid var(--secondary); }
  .metric { font-family: var(--font-sans); font-size: 30px; font-weight: 700; line-height: 1; color: var(--primary); font-variant-numeric: tabular-nums; margin-top: 12px; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: var(--fg-4); }
</style>
</head>
<body>
  <p class="eyebrow">Metric · Google Sans 30 / 700 · tabular-nums</p>
  <div class="grid">
    <div class="cell"><div class="label">Associados ativos</div><div class="metric">1.284</div></div>
    <div class="cell"><div class="label">Atividades abertas</div><div class="metric">47</div></div>
    <div class="cell"><div class="label">Em atraso</div><div class="metric">6</div></div>
    <div class="cell"><div class="label">Adimplência</div><div class="metric">92%</div></div>
  </div>
</body>
</html>
