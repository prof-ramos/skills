<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Colors — Surfaces</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 20px 22px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch .chip { border: 1px solid var(--border-soft); }
</style>
</head>
<body>
  <p class="eyebrow">Surfaces — pale blue-gray scale</p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="name">surface</div><div class="hex">#ffffff</div></div>
    <div class="swatch"><div class="chip" style="background:#f8fafc"></div><div class="name">background / low</div><div class="hex">#f8fafc</div></div>
    <div class="swatch"><div class="chip" style="background:#eef1f6"></div><div class="name">container</div><div class="hex">#eef1f6</div></div>
    <div class="swatch"><div class="chip" style="background:#e7edf4"></div><div class="name">container-high</div><div class="hex">#e7edf4</div></div>
    <div class="swatch"><div class="chip" style="background:#dde3ec"></div><div class="name">container-highest</div><div class="hex">#dde3ec</div></div>
  </div>
</body>
</html>
