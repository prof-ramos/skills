<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Components — Inputs</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(13,31,60,0.65); }
  .input {
    height: 48px; width: 100%; box-sizing: border-box;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 0 12px; font-family: var(--font-sans); font-size: 14px; color: var(--fg-2);
  }
  .input::placeholder { color: rgba(13,31,60,0.40); }
  .input.focused { border-color: #76aeea; box-shadow: 0 0 0 2px #76aeea33; outline: none; }
  .helper { font-size: 11px; color: var(--fg-4); }
  .helper.error { color: #b91c1c; }
</style>
</head>
<body>
  <p class="eyebrow">Inputs · 48px · 8px radius · sky-blue focus</p>
  <div class="grid">
    <div class="field">
      <label class="label">Email</label>
      <input class="input" type="email" placeholder="seu@email.com" />
      <span class="helper">Usado apenas para acesso.</span>
    </div>
    <div class="field">
      <label class="label">Senha</label>
      <input class="input focused" type="password" value="••••••••••" />
      <span class="helper">Foco — anel sky blue 2 px, offset 2 px.</span>
    </div>
    <div class="field">
      <label class="label">SIAPE</label>
      <input class="input" type="text" placeholder="0000000" />
    </div>
    <div class="field">
      <label class="label">Lotação</label>
      <input class="input" type="text" value="Embaixada em Paris" />
      <span class="helper error">Campo obrigatório.</span>
    </div>
  </div>
</body>
</html>
