<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Components — Sidebar item</title>
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 0; background: #06284f; min-height: 100vh; }
  .rail { width: 100%; min-height: 100vh; padding: 18px 0; font-family: var(--font-sans); }
  .item {
    display: flex; align-items: center; gap: 12px; min-height: 58px;
    padding: 0 36px; padding-left: 36px;
    border-left: 6px solid transparent;
    color: rgba(255,255,255,0.70); font-size: 14px; font-weight: 500;
    transition: background-color 150ms ease, color 150ms ease;
    line-height: 1.2;
  }
  .item .ico { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
  .item .ico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  .item:hover { background: #0d3260; color: #fff; }
  .item.active {
    background: #123d73; color: #fff; border-left-color: #76aeea; padding-left: 30px;
  }
  .badge {
    margin-left: auto; background: rgba(255,255,255,0.10); color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 9999px;
  }
  .label {
    font-size: 10px; color: rgba(255,255,255,0.40); letter-spacing: 0.10em;
    text-transform: uppercase; font-weight: 700; padding: 12px 36px 6px;
  }
</style>
</head>
<body>
  <nav class="rail">
    <div class="label">Sidebar nav · 288 px · navy #06284f</div>
    <a class="item active" href="#">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
      Dashboard
    </a>
    <a class="item" href="#">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      Associados
    </a>
    <a class="item" href="#">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg></span>
      Atividades
      <span class="badge">6</span>
    </a>
    <a class="item" href="#">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="M7 21h10"/><path d="M12 3v18"/></svg></span>
      Jurídico
    </a>
  </nav>
</body>
</html>
