[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "godmode-agnostic"
version = "0.2.0"
description = "Orchestrate upstream G0DM0D3 GODMODE for API models in coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
godmode-agnostic = "godmode_agnostic.cli:main"

[tool.setuptools.packages.find]
include = ["godmode_agnostic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
