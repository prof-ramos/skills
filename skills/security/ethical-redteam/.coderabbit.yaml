# CodeRabbit Configuration for Ethical Red Team Skill
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: pt-BR

# Max 250 characters
tone_instructions: "Seja profissional e construtivo. Foque em implicações de segurança. Aponte preocupações éticas/legais. Sugira boas práticas. Seja encorajador. Use pt-BR quando apropriado."

early_access: false

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  poem: true
  review_status: true
  sequence_diagrams: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop

  tools:
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true

  path_filters:
    - "!recon_output/**"
    - "!scan_output/**"
    - "!analysis/**"
    - "!reports/**"
    - "!logs/**"
    - "!*.log"
    - "!.venv-redteam/**"
    - "!venv/**"
    - "!__pycache__/**"
    - "!*.pyc"
    - "!*.pyo"
    - "!*.zip"
    - "!*.tar.gz"
    - "!*.pdf"

  path_instructions:
    - path: "**/*.py"
      instructions: |
        Check for hardcoded credentials, API keys, or sensitive data.
        Verify TOR routing is enforced for network operations.
        Ensure ethical validation (TLD blocking, authorization checks).
        Validate error handling and graceful degradation.
        Review compliance with OWASP/NIST methodologies.
        Check Python type hints and documentation.
        Ensure proper logging for audit trails.
        Validate input sanitization to prevent injection attacks.
    - path: "**/*.sh"
      instructions: |
        Verify shell scripts are POSIX-compliant where possible.
        Check resource limits (memory, disk usage) match documentation.

chat:
  auto_reply: true

knowledge_base:
  # learnings scope (individual learnings are added via `@coderabbitai` chat)
  learnings:
    scope: auto
